services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector 扩展容器
  # 提供关系型数据存储与文本向量索引支持
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlasdesk-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-atlasdesk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atlasdesk_secret_change_me}
      POSTGRES_DB: ${DB_NAME:-atlasdesk_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atlasdesk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-atlasdesk_user} -d ${DB_NAME:-atlasdesk_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 缓存与异步任务队列
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: atlasdesk-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - atlasdesk-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO 对象存储 (S3 兼容 API)
  # 存储原始企业文档与解析切片静态数据
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: atlasdesk-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API 端口
      - "9001:9001"   # Web 控制台端口
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - atlasdesk-network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO 自动创建 Bucket 初始化容器
  # ----------------------------------------------------------------------------
  create-buckets:
    image: minio/mc:latest
    container_name: atlasdesk-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${STORAGE_BUCKET:-atlasdesk-docs};
      exit 0;
      "
    networks:
      - atlasdesk-network

volumes:
  postgres_data:
    name: atlasdesk_postgres_data
  redis_data:
    name: atlasdesk_redis_data
  minio_data:
    name: atlasdesk_minio_data

networks:
  atlasdesk-network:
    name: atlasdesk-network
    driver: bridge
